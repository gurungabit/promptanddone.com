<!DOCTYPE html>
<html lang="en">

<title>Solar System</title>
<style>
:root{--acc:#9cc4ff;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;color:#eef2ff;
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{position:fixed;inset:0}
button{font-family:inherit;cursor:pointer;outline:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(0,0,0,.6) 100%)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;opacity:0;transition:opacity .35s;will-change:transform}
.lb span{position:absolute;font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(235,240,255,.8);white-space:nowrap;text-shadow:0 1px 5px #000,0 0 12px #000}
.lb i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border:1px solid rgba(255,255,255,.38);border-radius:50%;opacity:0;transition:opacity .3s}
.lb.tiny i{opacity:1}
#top{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 14px) calc(var(--sar) + 14px) 26px calc(var(--sal) + 18px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.5),transparent)}
#brand b{display:block;font-size:11px;font-weight:650;letter-spacing:.36em;margin-top:4px}
#brand small{display:block;margin-top:5px;font-size:11px;color:rgba(220,228,255,.62);letter-spacing:.06em;font-variant-numeric:tabular-nums}
#ctl{display:flex;gap:8px;pointer-events:auto}
.btn{height:38px;min-width:38px;padding:0 13px;border-radius:19px;border:1px solid rgba(255,255,255,.13);background:rgba(14,18,32,.5);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#eef2ff;font-size:12px;font-weight:600;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,transform .15s}
.btn:active{transform:scale(.94);background:rgba(60,80,140,.5)}
.btn svg{width:13px;height:13px;fill:currentColor}
.btn.on{background:rgba(120,160,255,.28);border-color:rgba(150,185,255,.5)}
#dock{position:absolute;left:0;right:0;bottom:0;padding:22px 0 calc(var(--sab) + 8px);display:flex;justify-content:center;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.72) 60%)}
#row{pointer-events:auto;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding:8px 16px 4px;max-width:100%;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,transparent,#000 20px,#000 calc(100% - 20px),transparent)}
#row::-webkit-scrollbar{display:none}
#row button{flex:0 0 auto;width:56px;background:none;border:0;color:rgba(230,236,255,.55);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:8px;padding:5px 0 6px;transition:color .3s}
#row i{position:relative;width:26px;height:26px;border-radius:50%;box-shadow:inset -6px -5px 9px rgba(0,0,0,.6);transition:transform .35s cubic-bezier(.2,.9,.3,1.3),box-shadow .35s}
#row button.on{color:#fff}
#row button.on i{transform:scale(1.2);box-shadow:inset -6px -5px 9px rgba(0,0,0,.5),0 0 0 2px rgba(0,0,0,.9),0 0 0 3.5px rgba(255,255,255,.9),0 0 18px 2px var(--c)}
#row i.sys{box-shadow:none;background:radial-gradient(circle,#ffcf70 0 3px,transparent 3.6px 7px,rgba(255,255,255,.5) 7px 8px,transparent 8.6px 11.6px,rgba(255,255,255,.34) 11.6px 12.6px,transparent 13px)}
#row button.on i.sys{box-shadow:0 0 0 2px rgba(0,0,0,.9),0 0 0 3.5px rgba(255,255,255,.9)}
#row i.rg::after{content:"";position:absolute;left:-8px;right:-8px;top:9px;height:8px;border:1.6px solid rgba(232,214,170,.9);border-radius:50%;transform:rotate(-20deg)}
#card{position:absolute;left:calc(var(--sal) + 12px);right:calc(var(--sar) + 12px);bottom:calc(var(--sab) + 96px);padding:16px 18px 18px;border-radius:24px;
  background:linear-gradient(160deg,rgba(26,32,54,.74),rgba(8,10,20,.78));-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);

  transform:translateY(26px) scale(.98);opacity:0;pointer-events:none;transition:transform .55s cubic-bezier(.2,.85,.2,1),opacity .4s}
#card.on{transform:none;opacity:1;pointer-events:auto}
#card .hd{display:flex;justify-content:space-between;align-items:flex-start}
#card .kind{font-size:10px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc)}
#card h2{margin:3px 0 0;font-size:31px;font-weight:650;letter-spacing:-.01em;line-height:1.08}
#card p{margin:9px 0 13px;font-size:13px;line-height:1.52;color:rgba(225,232,255,.8)}
#close{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;margin:-2px -4px 0 0}
#facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.09);border-radius:14px;overflow:hidden}
#facts div{background:rgba(9,12,23,.72);padding:9px 10px 10px;min-width:0}
#facts small{display:block;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(200,212,245,.55)}
#facts b{display:block;margin-top:3px;font-size:13.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
#cap{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 150px);text-align:center;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity 1s,transform 1s}
#cap.on{opacity:1;transform:none}
#cap h1{margin:0;font-size:clamp(25px,7.6vw,62px);font-weight:200;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;text-shadow:0 2px 30px rgba(0,0,0,.9)}
#cap p{margin:10px 0 0;font-size:11px;font-weight:500;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;color:rgba(220,230,255,.72);text-shadow:0 1px 12px #000}
#hint{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 102px);text-align:center;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(220,230,255,.6);pointer-events:none;opacity:0;transition:opacity .8s}
body.tour #hint{opacity:1;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#loader{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity 1.4s;z-index:9}
#loader.off{opacity:0;pointer-events:none}
#loader .ring{width:54px;height:54px;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);border-top-color:#ffcf70;animation:spin 1s linear infinite}
#loader span{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(220,230,255,.7);padding:0 24px;text-align:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:760px){
  #card{right:auto;width:356px;left:calc(var(--sal) + 24px);bottom:calc(var(--sab) + 108px)}
  #top{padding-left:calc(var(--sal) + 26px);padding-right:calc(var(--sar) + 22px);padding-top:calc(var(--sat) + 20px)}
  #cap{bottom:calc(var(--sab) + 170px)}

@media (max-height:500px){#card p{display:none}#card{padding:12px 14px 14px;width:330px;right:auto}#card h2{font-size:24px;margin-bottom:10px}#cap{bottom:calc(var(--sab) + 104px)}#hint{display:none}}
</style>
</head>

      if(show){placed.push(rect);b.lb.style.transform='translate3d('+b.sx.toFixed(1)+'px,'+b.sy.toFixed(1)+'px,0)';
        b.lbT.style.left=off.toFixed(1)+'px';b.lbT.style.top=(-off-13).toFixed(1)+'px';b.lb.classList.toggle('tiny',b.sr<5);}}
    b.lr=show?rect:null;const op=show?'1':'0';if(op!==b.op){b.op=op;b.lb.style.opacity=op;}}
}
function pick(x,y){let best=null,bs=1;
  for(const b of BODIES){if(!b.pickable)continue;const hr=max(b.sr,22);let s=hypot(x-b.sx,y-b.sy)/hr;
    const r=b.lr;if(r&&x>=r[0]-5&&x<=r[0]+r[2]+5&&y>=r[1]-7&&y<=r[1]+r[3]+7)s=min(s,.4);
    if(s<bs){bs=s;best=b;}}
  return best;}

/* ───────────── input ───────────── */
const drag={on:false,x:0,y:0,sx:0,sy:0,t:0,moved:0,pinch:0,multi:false},ptrs=new Map();
function zoomBy(f){if(fly)fly.dz=false;cam.distT=clamp(cam.distT*f,focus.r*1.3+.05,900);}
function bindInput(){
  const first=()=>stopTour();
  window.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#bTour'))return;first();},true);
  window.addEventListener('wheel',first,{capture:true,passive:true});window.addEventListener('keydown',first,true);
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size===1){drag.on=true;drag.x=drag.sx=e.clientX;drag.y=drag.sy=e.clientY;drag.t=performance.now();drag.moved=0;drag.multi=false;cam.vy=cam.vp=0;}
    else{drag.multi=true;drag.pinch=0;}});
  canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=hypot(a[0]-b[0],a[1]-b[1]);if(drag.pinch>0&&d>0)zoomBy(drag.pinch/d);drag.pinch=d;return;}
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;drag.moved+=abs(dx)+abs(dy);
    if(drag.moved>6){if(fly)fly.ang=false;const k=.0055;cam.yaw-=dx*k;cam.pitch+=dy*k;cam.vy=lerp(cam.vy,-dx*k*60,.5);cam.vp=lerp(cam.vp,dy*k*60,.5);}});
  const up=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(ptrs.size===1){const p=[...ptrs.values()][0];drag.x=p[0];drag.y=p[1];drag.pinch=0;}
    if(ptrs.size===0){drag.on=false;
      if(e.type==='pointerup'&&!drag.multi&&drag.moved<10&&performance.now()-drag.t<600){const b=pick(e.clientX,e.clientY);if(b)select(b.id);}
      if(performance.now()-drag.lastMove>90)cam.vy=cam.vp=0;}};
  canvas.addEventListener('pointermove',()=>{drag.lastMove=performance.now();});
  canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaMode===1?e.deltaY*30:e.deltaY;zoomBy(exp(clamp(d,-300,300)*(e.ctrlKey?.008:.0014)));},{passive:false});
  for(const ev of ['gesturestart','gesturechange','gestureend'])document.addEventListener(ev,e=>e.preventDefault());
  document.addEventListener('touchmove',e=>{if(e.target===canvas)e.preventDefault();},{passive:false});
  window.addEventListener('keydown',e=>{const ids=['system',...BODIES.map(b=>b.id)],i=ids.indexOf(mode);
    if(e.key==='ArrowRight')select(ids[(i+1)%ids.length]);else if(e.key==='ArrowLeft')select(ids[(i+ids.length-1)%ids.length]);
    else if(e.key===' '){e.preventDefault();togglePause();}else if(e.key==='Escape')select('system');
    else if(e.key==='+'||e.key==='=')zoomBy(.8);else if(e.key==='-')zoomBy(1.25);});
  window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,250));
}

/* ───────────── render ───────────── */
function drawSphere(pr){attribs(pr,sphBuf,5,[['aPos',3,0],['aUv',2,3]]);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,sphIdx);gl.drawElements(gl.TRIANGLES,sphCount,gl.UNSIGNED_SHORT,0);}
function render(now){
  const cw=canvas.width,ch=canvas.height;gl.viewport(0,0,cw,ch);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const near=clamp((cam.dist-focus.r)*.15,.01,2),proj=persp(fovY,aspect,near,5000,cam.ox,cam.oy),view=lookAt(cam.pos,cam.t),vp=mul4(proj,view);
  const vr=new Float32Array([view[0],view[1],view[2],view[4],view[5],view[6],view[8],view[9],view[10]]);
  const v0=new Float32Array(view);v0[12]=v0[13]=v0[14]=0;const vps=mul4(persp(fovY,aspect,1,3000,cam.ox,cam.oy),v0);
  const rel=b=>[cam.pos[0]-b.pos[0],cam.pos[1]-b.pos[1],cam.pos[2]-b.pos[2]];
  let p;
  // sky + stars
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.CULL_FACE);gl.disable(gl.BLEND);
  p=P.sky;gl.useProgram(p.p);gl.uniformMatrix4fv(p.u.uVPs,false,vps);bindTex(0,P.skyTex);gl.uniform1i(p.u.uTex,0);drawSphere(p);
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);
  p=P.star;gl.useProgram(p.p);gl.uniformMatrix4fv(p.u.uVPs,false,vps);gl.uniform1f(p.u.uDpr,dpr);gl.uniform1f(p.u.uTime,now);
  attribs(p,starBuf,7,[['aDir',3,0],['aC',4,3]]);gl.drawArrays(gl.POINTS,0,starCount);
  // opaque bodies
  gl.disable(gl.BLEND);gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);
  p=P.sun;gl.useProgram(p.p);gl.uniformMatrix4fv(p.u.uVP,false,vp);gl.uniform3f(p.u.uCenter,0,0,0);gl.uniformMatrix3fv(p.u.uRot,false,SUN.rot);gl.uniform1f(p.u.uRadius,SUN.r);
  gl.uniform3fv(p.u.uCamRel,cam.pos);gl.uniform1f(p.u.uTime,now%4000);drawSphere(p);
  p=P.planet;gl.useProgram(p.p);gl.uniformMatrix4fv(p.u.uVP,false,vp);gl.uniform1i(p.u.uTex,0);gl.uniform1i(p.u.uTex2,1);gl.uniform1i(p.u.uRingTex,2);
  for(const b of BODIES){if(b===SUN)continue;
    gl.uniform3fv(p.u.uCenter,b.pos);gl.uniformMatrix3fv(p.u.uRot,false,b.rot);gl.uniformMatrix3fv(p.u.uRotF,false,b.rot);gl.uniform1f(p.u.uRadius,b.r);
    gl.uniform3fv(p.u.uL,b.L);gl.uniform3fv(p.u.uCamRel,rel(b));gl.uniform4fv(p.u.uAtm,b.atm||[0,0,0,0]);
    gl.uniform1f(p.u.uBump,b.bump);gl.uniform1f(p.u.uSoft,b.soft);gl.uniform1f(p.u.uEarth,b===EARTH?1:0);gl.uniform1f(p.u.uCloud,(spinT*.0035)%1);
    gl.uniform2f(p.u.uTexel,1.5/b.size,3/b.size);
    const sat=b.id==='saturn';gl.uniform3f(p.u.uRing,sat?b.ring[0]*b.r:0,sat?b.ring[1]*b.r:1,sat?1:0);
    if(sat){gl.uniform3fv(p.u.uRingN,b.axis);bindTex(2,b.ringFlat);}
    bindTex(1,b===EARTH?P.earth2:b.tex);bindTex(0,b.tex);drawSphere(p);}
  p=P.ast;gl.useProgram(p.p);gl.uniformMatrix4fv(p.u.uVP,false,vp);gl.uniformMatrix3fv(p.u.uVR,false,vr);gl.uniform1f(p.u.uYears,simDays/365.25);
  gl.uniform1f(p.u.uPx,(ch/2)/tan(fovY/2)*2);attribs(p,astBuf,8,[['aA',4,0],['aB',4,4]]);gl.drawArrays(gl.POINTS,0,astCount);
  // transparent
  gl.enable(gl.BLEND);gl.depthMask(false);gl.disable(gl.CULL_FACE);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  p=P.orbit;gl.useProgram(p.p);gl.uniformMatrix4fv(p.u.uVP,false,vp);gl.uniform2f(p.u.uView,cw,ch);gl.uniform1f(p.u.uWidth,2.4*dpr);
  const close=focus===SUN?1:clamp((cam.dist/fitDist(focus)-1.2)/4,0,1);
  for(const b of BODIES){if(!b.P)continue;let al=.5*(.22+.78*close);
    if(b===MOON){al*=clamp((EARTH.sr-3)/8,0,1)*.8;if(al<=0)continue;gl.uniform3fv(p.u.uOff,EARTH.pos);}else gl.uniform3f(p.u.uOff,0,0,0);
    if(b===focus)al*=.25+.75*close;
    gl.uniform1f(p.u.uAlpha,al);gl.uniform1f(p.u.uHead,(b.E/TAU)%1);const c=b.rgb;gl.uniform3f(p.u.uCol,c[0],c[1],c[2]);
    attribs(p,b.orbBuf,8,[['aPos',3,0],['aNext',3,3],['aTS',2,6]]);gl.drawArrays(gl.TRIANGLE_STRIP,0,b.orbCount);}
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  p=P.ring;gl.useProgram(p.p);gl.uniformMatrix4fv(p.u.uVP,false,vp);gl.uniform1i(p.u.uTex,0);
  for(const b of BODIES){if(!b.ring)continue;gl.uniform3fv(p.u.uCenter,b.pos);gl.uniformMatrix3fv(p.u.uRot,false,b.tiltM);gl.uniform2f(p.u.uRR,b.ring[0]*b.r,b.ring[1]*b.r);
    gl.uniform3fv(p.u.uL,b.L);gl.uniform3fv(p.u.uCamRel,rel(b));gl.uniform3fv(p.u.uN,b.axis);gl.uniform1f(p.u.uR,b.r);bindTex(0,b.ringTex);
    attribs(p,ringBuf,3,[['aP',3,0]]);gl.drawArrays(gl.TRIANGLE_STRIP,0,ringCount);}
  gl.blendFunc(gl.ONE,gl.ONE);gl.enable(gl.CULL_FACE);
  p=P.atm;gl.useProgram(p.p);gl.uniformMatrix4fv(p.u.uVP,false,vp);
  for(const b of BODIES){if(!b.shell)continue;const s=b.shell;gl.uniform3fv(p.u.uCenter,b.pos);gl.uniformMatrix3fv(p.u.uRot,false,b.rot);gl.uniform1f(p.u.uRadius,b.r*s[0]);
    gl.uniform3fv(p.u.uL,b.L);gl.uniform3fv(p.u.uCamRel,rel(b));gl.uniform1f(p.u.uR,b.r);gl.uniform1f(p.u.uRs,b.r*s[0]);gl.uniform4f(p.u.uCol,s[1],s[2],s[3],s[4]);drawSphere(p);}
  gl.disable(gl.CULL_FACE);
  p=P.glow;gl.useProgram(p.p);const ds=hypot(cam.pos[0],cam.pos[1],cam.pos[2]),size=max(SUN.r*7,ds*.1);
  gl.uniformMatrix4fv(p.u.uView,false,view);gl.uniformMatrix4fv(p.u.uProj,false,proj);gl.uniform1f(p.u.uSize,size);gl.uniform1f(p.u.uR0,SUN.r/size);gl.uniform1f(p.u.uTime,now%4000);
  attribs(p,quadBuf,2,[['aQ',2,0]]);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  return vp;
}
let last=0;
function frame(ts){requestAnimationFrame(frame);const now=ts/1000,dt=min(max(now-last,0),.05);last=now;
  if(!paused){simDays+=dt*BASE_RATE*SPEEDS[speedI];spinT+=dt;}
  updateBodies();updateTour(dt);updateCamera(dt);
  const vp=render(now);updateLabels(vp);updateHud(now);}

/* ───────────── boot ───────────── */
const tick=m=>new Promise(r=>{$('#lmsg').textContent=m;requestAnimationFrame(()=>setTimeout(r,0));});
async function boot(){
  resize();buildUI();bindInput();
  for(const b of BODIES){b.tiltM=mul3(rotY((b.az||0)*D2R),rotZ(-b.tilt*D2R));const e=b.tilt*D2R,A=(b.az||0)*D2R;b.axis=[sin(e)*cos(A),cos(e),-sin(e)*sin(A)];b.spin=b.spin||0;b.spin0=rnd()*TAU;
    const n=parseInt(b.col.slice(1),16);b.rgb=[(n>>16)/255,(n>>8&255)/255,(n&255)/255];}
  await tick('Igniting the Sun');
  buildGeometry();prepOrbits();
  P.sky=mkProg(SKY_VS,SKY_FS,'sky');P.star=mkProg(STAR_VS,STAR_FS,'star');P.sun=mkProg(BODY_VS,SUN_FS,'sun');P.glow=mkProg(GLOW_VS,GLOW_FS,'glow');
  await tick('Scattering stars');
  P.skyTex=bake(10,2048,1024,false);
  P.planet=mkProg(BODY_VS,PLANET_FS,'planet');P.atm=mkProg(BODY_VS,ATM_FS,'atm');P.ring=mkProg(RING_VS,RING_FS,'ring');P.orbit=mkProg(ORBIT_VS,ORBIT_FS,'orbit');P.ast=mkProg(AST_VS,AST_FS,'ast');
  masks=maskTextures();
  for(const b of BODIES){if(b.type==null)continue;await tick('Forming '+b.name);b.tex=bake(b.type,b.size,b.size/2,true);
    if(b===EARTH)P.earth2=bake(3,2048,1024,true);}
  ringTexture(byId.saturn,true);ringTexture(byId.uranus,false);
  updateBodies();
  const h=location.hash.slice(1);
  if(byId[h]||h==='system'){tour.on=false;document.body.classList.remove('tour');$('#bTour').classList.remove('on');
    cam.dist=cam.distT=overviewDist();cam.pitch=.5;if(h==='system')flyTo(SUN,{system:true,dur:.01});else flyTo(byId[h],{card:true,dur:.01});}
  else tourNext(true);
  started=true;syncDock();{const el=row.querySelector('.on');if(el)row.scrollLeft=el.offsetLeft-row.clientWidth/2+el.offsetWidth/2;}last=performance.now()/1000;requestAnimationFrame(frame);
  $('#loader').classList.add('off');
}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();});
canvas.addEventListener('webglcontextrestored',()=>location.reload());
boot().catch(e=>{console.error(e);fail('Could not start: '+e.message);});
})();
</script>
