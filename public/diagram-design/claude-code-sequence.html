<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Claude Code works</title>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0b0b0c;
      --color-ink:     #f2f2f0;
      --color-muted:   #a3a39d;
      --color-soft:    #84847e;
      --color-accent:  #ffb454;
      --font-sans:     'Chivo', system-ui, sans-serif;
      --font-title:    'Chivo', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 0.75rem;
    }

    /* Portrait frame: fills a phone screen, stays phone-shaped on desktop. */
    .frame { max-width: 520px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-soft);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-title);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.1;
      color: var(--color-ink);
      margin-bottom: 1rem;
    }

    .note {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      line-height: 1.5;
      color: var(--color-soft);
      margin-top: 0.75rem;
    }

    svg { width: 100%; min-width: 360px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Claude Code</p>
    <h1>From prompt to finished change</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 360 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="claude-code-sequence-title claude-code-sequence-desc">
        <title id="claude-code-sequence-title">How Claude Code works</title>
        <desc id="claude-code-sequence-desc">You send a request to Claude Code, which sends it with context to Claude; Claude asks for tool calls that Claude Code runs in your repo, after your approval when required, and returns the results until Claude gives a final reply and the change is done.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a3a39d"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ffb454"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#0b0b0c"/>

        <!-- ── Combined fragments ── -->
        <!-- LOOP: the agent loop, spans all four lifelines -->
        <rect x="12" y="172" width="336" height="332" rx="4" fill="rgba(242,242,240,0.04)" stroke="rgba(242,242,240,0.22)" stroke-width="1"/>
        <rect x="12" y="172" width="40" height="16" rx="2" fill="#0b0b0c" stroke="rgba(242,242,240,0.22)" stroke-width="1"/>
        <text x="32" y="184" fill="#a3a39d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
        <text x="24" y="204" fill="#a3a39d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[until no tool calls]</text>

        <!-- OPT: permission prompt, You + Claude Code only -->
        <rect x="20" y="252" width="112" height="120" rx="4" fill="rgba(242,242,240,0.04)" stroke="rgba(242,242,240,0.22)" stroke-width="1"/>
        <rect x="20" y="252" width="40" height="16" rx="2" fill="#0b0b0c" stroke="rgba(242,242,240,0.22)" stroke-width="1"/>
        <text x="40" y="264" fill="#a3a39d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="28" y="284" fill="#a3a39d" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[if mode asks]</text>

        <!-- ── Lifelines ── -->
        <line x1="32"  y1="64" x2="32"  y2="616" stroke="rgba(242,242,240,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="118" y1="64" x2="118" y2="616" stroke="rgba(242,242,240,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="216" y1="64" x2="216" y2="616" stroke="rgba(242,242,240,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="308" y1="64" x2="308" y2="616" stroke="rgba(242,242,240,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ── Messages (top → down) ── -->
        <!-- 1 You → Claude Code -->
        <line x1="32" y1="104" x2="114" y2="104" stroke="#a3a39d" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- 2 Claude Code → Claude -->
        <line x1="122" y1="148" x2="212" y2="148" stroke="#a3a39d" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- 3 Claude → Claude Code (return: tool call) -->
        <line x1="212" y1="232" x2="122" y2="232" stroke="#a3a39d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- 4 Claude Code → You -->
        <line x1="114" y1="312" x2="36" y2="312" stroke="#a3a39d" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- 5 You → Claude Code (return: allow) -->
        <line x1="36" y1="352" x2="114" y2="352" stroke="#a3a39d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- 6 Claude Code → Your repo -->
        <line x1="122" y1="404" x2="304" y2="404" stroke="#a3a39d" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- 7 Your repo → Claude Code (return: output) -->
        <line x1="304" y1="444" x2="122" y2="444" stroke="#a3a39d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- 8 Claude Code → Claude -->
        <line x1="122" y1="484" x2="212" y2="484" stroke="#a3a39d" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- 9 Claude → Claude Code (return: final reply) -->
        <line x1="212" y1="548" x2="122" y2="548" stroke="#a3a39d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- 10 Claude Code → You — headline -->
        <line x1="114" y1="592" x2="32" y2="592" stroke="#ffb454" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- ── Arrow labels (opaque masks, 6px clear of stroke) ── -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" text-anchor="middle">
          <rect x="48" y="86" width="52" height="12" fill="#0b0b0c"/>
          <text x="74" y="95" fill="#a3a39d">REQUEST</text>

          <rect x="128" y="130" width="80" height="12" fill="#0b0b0c"/>
          <text x="168" y="139" fill="#a3a39d">CONTEXT+TOOLS</text>

          <rect x="140" y="214" width="56" height="12" fill="#0b0b0c"/>
          <text x="168" y="223" fill="#a3a39d">TOOL CALL</text>

          <rect x="48" y="294" width="52" height="12" fill="#0b0b0c"/>
          <text x="74" y="303" fill="#a3a39d">APPROVE?</text>

          <rect x="56" y="334" width="36" height="12" fill="#0b0b0c"/>
          <text x="74" y="343" fill="#a3a39d">ALLOW</text>

          <rect x="236" y="386" width="52" height="12" fill="#0b0b0c"/>
          <text x="262" y="395" fill="#a3a39d">RUN TOOL</text>

          <rect x="240" y="426" width="44" height="12" fill="#0b0b0c"/>
          <text x="262" y="435" fill="#a3a39d">OUTPUT</text>

          <rect x="144" y="466" width="48" height="12" fill="#0b0b0c"/>
          <text x="168" y="475" fill="#a3a39d">RESULT</text>

          <rect x="132" y="530" width="72" height="12" fill="#0b0b0c"/>
          <text x="168" y="539" fill="#a3a39d">FINAL REPLY</text>

          <rect x="40" y="574" width="68" height="12" fill="#0b0b0c"/>
          <text x="74" y="583" fill="#ffb454">CHANGE DONE</text>
        </g>

        <!-- ── Activation bars ── -->
        <rect x="114" y="104" width="8" height="488" fill="rgba(242,242,240,0.06)" stroke="#a3a39d" stroke-width="0.8"/>
        <rect x="212" y="148" width="8" height="84"  fill="rgba(242,242,240,0.06)" stroke="#a3a39d" stroke-width="0.8"/>
        <rect x="212" y="484" width="8" height="64"  fill="rgba(242,242,240,0.06)" stroke="#a3a39d" stroke-width="0.8"/>
        <rect x="28"  y="312" width="8" height="40"  fill="rgba(242,242,240,0.06)" stroke="#a3a39d" stroke-width="0.8"/>
        <rect x="304" y="404" width="8" height="40"  fill="rgba(242,242,240,0.06)" stroke="#a3a39d" stroke-width="0.8"/>

        <!-- ── Actors (drawn last) ── -->
        <!-- You: input -->
        <rect x="8" y="16" width="48" height="48" rx="6" fill="#0b0b0c"/>
        <rect x="8" y="16" width="48" height="48" rx="6" fill="rgba(163,163,157,0.10)" stroke="#84847e" stroke-width="1"/>
        <text x="32" y="44" fill="#f2f2f0" font-size="12" font-weight="700" font-family="'Chivo', system-ui, sans-serif" text-anchor="middle">You</text>

        <!-- Claude Code: focal -->
        <rect x="68" y="16" width="100" height="48" rx="6" fill="#0b0b0c"/>
        <rect x="68" y="16" width="100" height="48" rx="6" fill="rgba(255,180,84,0.10)" stroke="#ffb454" stroke-width="1.2"/>
        <text x="118" y="38" fill="#f2f2f0" font-size="12" font-weight="700" font-family="'Chivo', system-ui, sans-serif" text-anchor="middle">Claude Code</text>
        <text x="118" y="52" fill="#84847e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">agent loop</text>

        <!-- Claude: external model -->
        <rect x="180" y="16" width="72" height="48" rx="6" fill="#0b0b0c"/>
        <rect x="180" y="16" width="72" height="48" rx="6" fill="rgba(242,242,240,0.03)" stroke="rgba(242,242,240,0.30)" stroke-width="1"/>
        <text x="216" y="38" fill="#f2f2f0" font-size="12" font-weight="700" font-family="'Chivo', system-ui, sans-serif" text-anchor="middle">Claude</text>
        <text x="216" y="52" fill="#84847e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">model API</text>

        <!-- Your repo: store -->
        <rect x="264" y="16" width="88" height="48" rx="6" fill="#0b0b0c"/>
        <rect x="264" y="16" width="88" height="48" rx="6" fill="rgba(242,242,240,0.05)" stroke="#a3a39d" stroke-width="1"/>
        <text x="308" y="38" fill="#f2f2f0" font-size="12" font-weight="700" font-family="'Chivo', system-ui, sans-serif" text-anchor="middle">Your repo</text>
        <text x="308" y="52" fill="#84847e" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">files · shell</text>

        <!-- ── Legend strip ── -->
        <line x1="12" y1="636" x2="348" y2="636" stroke="rgba(242,242,240,0.12)" stroke-width="1"/>
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#84847e">
          <line x1="16" y1="660" x2="40" y2="660" stroke="#a3a39d" stroke-width="1" marker-end="url(#arrow)"/>
          <text x="48" y="663">CALL</text>
          <line x1="128" y1="660" x2="152" y2="660" stroke="#a3a39d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <text x="160" y="663">RETURN</text>
          <line x1="240" y1="660" x2="264" y2="660" stroke="#ffb454" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
          <text x="272" y="663">OUTCOME</text>
        </g>
      </svg>
    </div>

    <p class="note">Tools (read, edit, shell) run on your machine. Claude only sees what Claude Code sends back.</p>
  </div>
</body>
</html>
